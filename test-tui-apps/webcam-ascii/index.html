<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webcam ASCII Art</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        #controls {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.8);
            border: 1px solid #ffffff;
            padding: 15px;
            border-radius: 8px;
            z-index: 1000;
            max-width: 600px;
            margin: 0 auto;
        }

        #controls h1 {
            font-size: 18px;
            margin-bottom: 15px;
            text-align: center;
        }

        .control-group {
            margin-bottom: 12px;
        }

        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
        }

        .control-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            background: #333;
            outline: none;
            border-radius: 3px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: #ffffff;
            cursor: pointer;
            border-radius: 50%;
        }

        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: #ffffff;
            cursor: pointer;
            border-radius: 50%;
            border: none;
        }

        .value-display {
            min-width: 80px;
            text-align: right;
            font-size: 12px;
            color: #aaa;
        }

        button {
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 10px 20px;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #cccccc;
        }

        button:disabled {
            background-color: #666666;
            color: #333333;
            cursor: not-allowed;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        #status {
            text-align: center;
            font-size: 12px;
            color: #888;
            margin-top: 10px;
        }

        #error {
            color: #ff6666;
            text-align: center;
            font-size: 12px;
            margin-top: 10px;
            display: none;
        }

        #ascii-container {
            margin-top: 180px;
            text-align: center;
            line-height: 1;
            letter-spacing: 0;
            white-space: pre;
            font-size: 10px;
            overflow: auto;
            max-width: 100%;
            max-height: calc(100vh - 200px);
        }

        #ascii-output {
            display: inline-block;
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            line-height: 0.65;
            letter-spacing: 0.1em;
            color: #ffffff;
            user-select: none;
        }

        #video, #canvas {
            display: none;
        }

        .stats {
            font-size: 11px;
            color: #666;
            text-align: center;
            margin-top: 5px;
        }

        .hide-controls #controls {
            opacity: 0.2;
            transition: opacity 0.3s;
        }

        .hide-controls #controls:hover {
            opacity: 1;
        }

        @media (max-width: 768px) {
            #controls {
                top: 10px;
                left: 10px;
                right: 10px;
                padding: 10px;
            }

            #ascii-container {
                margin-top: 200px;
            }
        }
    </style>
</head>
<body>
    <div id="controls">
        <h1>Webcam ASCII Art</h1>

        <div class="control-group">
            <label for="width-slider">Width (characters across):</label>
            <div class="control-row">
                <input type="range" id="width-slider" min="30" max="200" value="100" step="5">
                <span class="value-display" id="width-value">100</span>
            </div>
        </div>

        <div class="control-group">
            <label for="height-slider">Height (characters down):</label>
            <div class="control-row">
                <input type="range" id="height-slider" min="20" max="150" value="60" step="5">
                <span class="value-display" id="height-value">60</span>
            </div>
        </div>

        <div class="control-group">
            <label for="font-size-slider">Font Size:</label>
            <div class="control-row">
                <input type="range" id="font-size-slider" min="6" max="16" value="10" step="1">
                <span class="value-display" id="font-size-value">10px</span>
            </div>
        </div>

        <div class="control-group">
            <label for="charset-select">Character Set:</label>
            <select id="charset-select" style="width: 100%; padding: 8px; background: #333; color: #fff; border: 1px solid #666; border-radius: 4px; font-family: inherit;">
                <option value="simple">Simple (12 chars)</option>
                <option value="standard" selected>Standard (70 chars)</option>
                <option value="blocks">Block Elements</option>
                <option value="minimal">Minimal (8 chars)</option>
            </select>
        </div>

        <div class="button-group">
            <button id="start-btn">Start Camera</button>
            <button id="stop-btn" disabled>Stop</button>
            <button id="toggle-controls-btn">Hide Controls</button>
        </div>

        <div id="status">Ready to start</div>
        <div id="error"></div>
        <div class="stats" id="fps-display">FPS: --</div>
    </div>

    <div id="ascii-container">
        <div id="ascii-output">Click "Start Camera" to begin</div>
    </div>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <script>
        // ASCII Art Converter
        class AsciiConverter {
            constructor() {
                this.charSets = {
                    simple: ' .:-=+*#%@',
                    standard: '$@B%8&WM#*oahkbdpqwmZO0QLCJUYXzcvunxrjft/\\|()1{}[]?-_+~<>i!lI;:,"^`\'. ',
                    blocks: ' ░▒▓█',
                    minimal: ' .:+#@'
                };
                this.currentCharSet = this.charSets.standard;
            }

            setCharSet(type) {
                if (this.charSets[type]) {
                    this.currentCharSet = this.charSets[type];
                }
            }

            getBrightness(r, g, b) {
                // Standard luminance calculation
                return 0.299 * r + 0.587 * g + 0.114 * b;
            }

            pixelToChar(r, g, b) {
                const brightness = this.getBrightness(r, g, b);
                const charIndex = Math.floor((brightness / 255) * (this.currentCharSet.length - 1));
                return this.currentCharSet[charIndex];
            }

            imageDataToAscii(imageData, width, height) {
                let ascii = '';
                const data = imageData.data;

                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < width; x++) {
                        const offset = (y * width + x) * 4;
                        const r = data[offset];
                        const g = data[offset + 1];
                        const b = data[offset + 2];
                        ascii += this.pixelToChar(r, g, b);
                    }
                    ascii += '\n';
                }

                return ascii;
            }
        }

        // Webcam Manager
        class WebcamManager {
            constructor() {
                this.video = document.getElementById('video');
                this.canvas = document.getElementById('canvas');
                this.ctx = this.canvas.getContext('2d', { willReadFrequently: true });
                this.stream = null;
                this.isRunning = false;
            }

            async start() {
                try {
                    const constraints = {
                        video: {
                            width: { ideal: 1280 },
                            height: { ideal: 720 },
                            facingMode: 'user'
                        }
                    };

                    this.stream = await navigator.mediaDevices.getUserMedia(constraints);
                    this.video.srcObject = this.stream;

                    return new Promise((resolve, reject) => {
                        this.video.onloadedmetadata = () => {
                            this.isRunning = true;
                            resolve();
                        };
                        this.video.onerror = reject;
                    });
                } catch (error) {
                    throw new Error(`Camera access failed: ${error.message}`);
                }
            }

            stop() {
                if (this.stream) {
                    this.stream.getTracks().forEach(track => track.stop());
                    this.stream = null;
                }
                this.isRunning = false;
            }

            captureFrame(targetWidth, targetHeight) {
                if (!this.isRunning) return null;

                this.canvas.width = targetWidth;
                this.canvas.height = targetHeight;

                this.ctx.drawImage(this.video, 0, 0, targetWidth, targetHeight);
                return this.ctx.getImageData(0, 0, targetWidth, targetHeight);
            }
        }

        // Main Application
        class AsciiCameraApp {
            constructor() {
                this.converter = new AsciiConverter();
                this.webcam = new WebcamManager();
                this.animationId = null;
                this.width = 100;
                this.height = 60;
                this.fontSize = 10;

                // FPS tracking
                this.frameCount = 0;
                this.lastFpsUpdate = Date.now();
                this.currentFps = 0;

                this.initControls();
            }

            initControls() {
                // Start button
                document.getElementById('start-btn').addEventListener('click', async () => {
                    await this.start();
                });

                // Stop button
                document.getElementById('stop-btn').addEventListener('click', () => {
                    this.stop();
                });

                // Width slider
                const widthSlider = document.getElementById('width-slider');
                const widthValue = document.getElementById('width-value');
                widthSlider.addEventListener('input', (e) => {
                    this.width = parseInt(e.target.value);
                    widthValue.textContent = this.width;
                });

                // Height slider
                const heightSlider = document.getElementById('height-slider');
                const heightValue = document.getElementById('height-value');
                heightSlider.addEventListener('input', (e) => {
                    this.height = parseInt(e.target.value);
                    heightValue.textContent = this.height;
                });

                // Font size slider
                const fontSizeSlider = document.getElementById('font-size-slider');
                const fontSizeValue = document.getElementById('font-size-value');
                fontSizeSlider.addEventListener('input', (e) => {
                    this.fontSize = parseInt(e.target.value);
                    fontSizeValue.textContent = this.fontSize + 'px';
                    document.getElementById('ascii-output').style.fontSize = this.fontSize + 'px';
                });

                // Character set selector
                document.getElementById('charset-select').addEventListener('change', (e) => {
                    this.converter.setCharSet(e.target.value);
                });

                // Toggle controls
                document.getElementById('toggle-controls-btn').addEventListener('click', (e) => {
                    document.body.classList.toggle('hide-controls');
                    e.target.textContent = document.body.classList.contains('hide-controls')
                        ? 'Show Controls'
                        : 'Hide Controls';
                });
            }

            showError(message) {
                const errorEl = document.getElementById('error');
                errorEl.textContent = message;
                errorEl.style.display = 'block';
                setTimeout(() => {
                    errorEl.style.display = 'none';
                }, 5000);
            }

            updateStatus(message) {
                document.getElementById('status').textContent = message;
            }

            async start() {
                try {
                    this.updateStatus('Starting camera...');

                    await this.webcam.start();

                    document.getElementById('start-btn').disabled = true;
                    document.getElementById('stop-btn').disabled = false;

                    this.updateStatus('Camera active - Converting to ASCII...');
                    this.render();
                } catch (error) {
                    this.showError(error.message);
                    this.updateStatus('Failed to start camera');
                    console.error(error);
                }
            }

            stop() {
                this.webcam.stop();

                if (this.animationId) {
                    cancelAnimationFrame(this.animationId);
                    this.animationId = null;
                }

                document.getElementById('start-btn').disabled = false;
                document.getElementById('stop-btn').disabled = true;
                document.getElementById('ascii-output').textContent = 'Camera stopped. Click "Start Camera" to resume.';

                this.updateStatus('Camera stopped');
                document.getElementById('fps-display').textContent = 'FPS: --';
            }

            updateFps() {
                this.frameCount++;
                const now = Date.now();
                const elapsed = now - this.lastFpsUpdate;

                if (elapsed >= 1000) {
                    this.currentFps = Math.round((this.frameCount / elapsed) * 1000);
                    document.getElementById('fps-display').textContent = `FPS: ${this.currentFps}`;
                    this.frameCount = 0;
                    this.lastFpsUpdate = now;
                }
            }

            render() {
                if (!this.webcam.isRunning) return;

                const imageData = this.webcam.captureFrame(this.width, this.height);

                if (imageData) {
                    const ascii = this.converter.imageDataToAscii(imageData, this.width, this.height);
                    document.getElementById('ascii-output').textContent = ascii;
                    this.updateFps();
                }

                this.animationId = requestAnimationFrame(() => this.render());
            }
        }

        // Initialize app when DOM is ready
        let app;
        document.addEventListener('DOMContentLoaded', () => {
            app = new AsciiCameraApp();

            // Check for getUserMedia support
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                document.getElementById('error').textContent =
                    'Your browser does not support camera access. Please use a modern browser like Chrome or Safari.';
                document.getElementById('error').style.display = 'block';
                document.getElementById('start-btn').disabled = true;
            }
        });
    </script>
</body>
</html>
